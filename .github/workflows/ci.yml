name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv && uv pip install -e ".[test,fast,gym,jax]"
      - run: uv run pytest -m "not slow" -q

  test-pure-python:
    # The package must also work without Numba.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv venv && uv pip install -e ".[test]"
      - run: uv run pytest -m "not slow" -q

  regression:
    # Full-batch simulations (slow tests).
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv venv && uv pip install -e ".[test,fast,gym,minari,parquet,jax]" diffrax pytest-xdist
      - run: uv run pytest -m slow -n auto -q

  package:
    # Build the sdist and wheel and check the metadata PyPI will see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check --strict dist/*

  docs:
    # Build the documentation site (strict: broken links fail). Deployment is a separate, manual step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv venv && uv pip install -e ".[docs]"
      - run: uv run mkdocs build --strict
